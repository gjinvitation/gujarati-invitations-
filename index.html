<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>સીમંત સંસ્કાર સંપાદન</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- મુખ્ય કંકોત્રીનું કન્ટેનર -->
    <div class="invitation-container">
        <img src="card_background.jpg" alt="સીમંત કાર્ડ" class="background-image">
        
        <!-- દરેક લખાણ માટે અલગ 'span' ટેગ, id દ્વારા ઓળખાશે -->
        <span id="text-snehi" class="editable-text">સ્નેહી શ્રી...</span>
        <span id="text-parents" class="editable-text">અ.સૌ. મધુબેન તથા કમલેશભાઈ કેશુભાઈ પટેલ</span>
        <span id="text-child" class="editable-text">ચિ. ભાર્ગવ</span>
        <span id="text-mother" class="editable-text">અ.સૌ. મયુરી</span>
        <span id="text-date-time" class="editable-text">તા. ૨૩/૦૭/૨૦૨૭, ગુરુવાર સવારે ૯:૦૦ કલાકે</span>
        <span id="text-lunch-date" class="editable-text">તા. ૨૩/૦૭/૨૦૨૭, ગુરુવાર બપોરે ૧૨:૩૦ કલાકે</span>
        <span id="text-hosts" class="editable-text">કમલેશભાઈ કેશુભાઈ પટેલ <br>મનુભાઈ કેશુભાઈ પટેલ</span>
        <span id="text-address" class="editable-text">અમારૂ નિવાસ સ્થાન<br>મો.: 9904564376</span>
    </div>

    <!-- એડિટિંગ પેનલ (ફોર્મ) -->
    <div id="editor-panel">
        <h2>Card Editor</h2>
        <p>Fill in the details below to update the card.</p>

        <div class="form-group">
            <label for="inp-snehi">Snehi Shri Name:</label>
            <input type="text" id="inp-snehi" placeholder="Enter Snehi Shri name">
        </div>
        <div class="form-group">
            <label for="inp-parents">Parents Name:</label>
            <input type="text" id="inp-parents" placeholder="Enter parents name">
        </div>
        <div class="form-group">
            <label for="inp-child">Child Name:</label>
            <input type="text" id="inp-child" placeholder="Enter child name">
        </div>
        <div class="form-group">
            <label for="inp-mother">Mother Name:</label>
            <input type="text" id="inp-mother" placeholder="Enter mother name">
        </div>
        <div class="form-group">
            <label for="inp-date-time">Program Date & Time:</label>
            <input type="text" id="inp-date-time" placeholder="Enter date and time">
        </div>
        <div class="form-group">
            <label for="inp-lunch-date">Lunch Date & Time:</label>
            <input type="text" id="inp-lunch-date" placeholder="Enter lunch date and time">
        </div>
        <div class="form-group">
            <label for="inp-hosts">Hosts Names:</label>
            <textarea id="inp-hosts" rows="2" placeholder="Enter hosts names"></textarea>
        </div>
        <div class="form-group">
            <label for="inp-address">Address & Mobile No.:</label>
            <textarea id="inp-address" rows="2" placeholder="Enter address and mobile"></textarea>
        </div>

        <button id="download-btn">Download Card (Image)</button>
    </div>

    <script src="script.js"></script>
</body>
                </html>
