<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gujarati Invitations - Digital Templates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            background-color: #ff4757;
            color: white;
            padding: 25px;
            border-radius: 8px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
        }
        p {
            font-size: 16px;
        }
        .container {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ગુજરાતી ઇન્વિટેશન ટેમ્પ્લેટ્સ</h1>
        <p>તમારા સુંદર પ્રસંગો માટે ડિજિટલ કંકોત્રી અને ડિઝાઇન</p>
    </header>

    <div class="container">
        <!-- અહીં તમારો પહેલો ફોટો દેખાશે -->
        <div class="card">
            <img src="your-image-name.jpg" alt="Invitation Template">
            <h3>Baby Shower / સીમંત</h3>
            <p>શ્રેષ્ઠ ડિજિટલ ટેમ્પ્લેટ</p>
        </div>
    </div>

</body>
</html>
